<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-Symbol der Partykiste: offene Kiste, aus der Konfetti fliegt. Quelle für die PNG-Symbole (tools/app-icons.py). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#e2361a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a10"/>
      <stop offset="1" stop-color="#160c06"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="45%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="190" fill="url(#glow)"/>
  <!-- Konfetti -->
  <g>
    <rect x="150" y="118" width="22" height="38" rx="6" fill="#22d3ee" transform="rotate(-28 161 137)"/>
    <rect x="330" y="104" width="22" height="38" rx="6" fill="#facc15" transform="rotate(24 341 123)"/>
    <rect x="244" y="78" width="22" height="38" rx="6" fill="#ffffff" transform="rotate(8 255 97)"/>
    <rect x="378" y="186" width="20" height="34" rx="6" fill="#a855f7" transform="rotate(48 388 203)"/>
    <rect x="112" y="200" width="20" height="34" rx="6" fill="#34d399" transform="rotate(-50 122 217)"/>
    <circle cx="206" cy="150" r="13" fill="#ff6fae"/>
    <circle cx="300" cy="160" r="12" fill="#22d3ee"/>
    <circle cx="356" cy="150" r="9" fill="#ffffff"/>
    <circle cx="150" cy="176" r="9" fill="#facc15"/>
    <path d="M232 176q12-26 30 0t30 0" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- Kiste -->
  <path d="M120 262h272l-18 150a24 24 0 0 1-24 21H162a24 24 0 0 1-24-21Z" fill="url(#box)"/>
  <path d="M120 262h272l-6 48H126Z" fill="#000" opacity=".25"/>
  <rect x="104" y="230" width="304" height="46" rx="14" fill="#3a2416"/>
  <rect x="104" y="230" width="304" height="14" rx="7" fill="#ffffff" opacity=".12"/>
